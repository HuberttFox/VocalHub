services:
  worker:
    profiles: ["worker"]
    image: ${VOCALHUB_WORKER_IMAGE:?VOCALHUB_WORKER_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      VOCADB_BASE_URL: ${VOCADB_BASE_URL:-https://vocadb.net/api/}
      VOCADB_USER_AGENT: ${VOCADB_USER_AGENT:?VOCADB_USER_AGENT is required}
      VOCADB_TIMEOUT_MS: ${VOCADB_TIMEOUT_MS:-10000}
      VOCADB_ACTIVITY_OVERLAP_MS: ${VOCADB_ACTIVITY_OVERLAP_MS:-900000}
      VOCADB_SETTLEMENT_LAG_MS: ${VOCADB_SETTLEMENT_LAG_MS:-120000}
      VOCADB_ARTIST_REFRESH_INTERVAL_MS: ${VOCADB_ARTIST_REFRESH_INTERVAL_MS:-604800000}
      VOCADB_SYNC_CONCURRENCY: ${VOCADB_SYNC_CONCURRENCY:-2}
    restart: "no"
    stop_grace_period: 60s

  session-cleanup:
    profiles: ["maintenance"]
    image: ${VOCALHUB_MAINTENANCE_IMAGE:?VOCALHUB_MAINTENANCE_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"

  playlist-report-cleanup:
    profiles: ["maintenance"]
    image: ${VOCALHUB_MAINTENANCE_IMAGE:?VOCALHUB_MAINTENANCE_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    entrypoint: ["node", "/app/build/maintenance/governance/cleanup-playlist-reports.js"]
    command: []
    restart: "no"

  playlist-moderation:
    profiles: ["maintenance"]
    image: ${VOCALHUB_MAINTENANCE_IMAGE:?VOCALHUB_MAINTENANCE_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    entrypoint: ["node", "/app/build/maintenance/governance/moderate-playlist.js"]
    command: []
    restart: "no"
