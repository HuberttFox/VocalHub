services:
  app:
    image: ${VOCALHUB_APP_IMAGE:?VOCALHUB_APP_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:?AUTH_GITHUB_ID is required}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:?AUTH_GITHUB_SECRET is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
      OPERATIONAL_STATUS_TOKEN: ${OPERATIONAL_STATUS_TOKEN:?OPERATIONAL_STATUS_TOKEN is required}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${VOCALHUB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  migrate:
    profiles: ["migrate"]
    image: ${VOCALHUB_MIGRATE_IMAGE:?VOCALHUB_MIGRATE_IMAGE is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:-}
    restart: "no"
